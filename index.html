<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestor de tareas escolares hecho con JavaScript: agrega, edita, filtra y conserva tus tareas en el navegador.">
    <title>Gestor de tareas escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="salto" href="#lista">Saltar a la lista de tareas</a>

    <header class="encabezado">
        <h1>Gestor de tareas escolares</h1>
        <p>Organiza tus entregas. Tus tareas se guardan en este navegador.</p>
    </header>

    <main class="contenedor">
        <p id="anuncio" class="anuncio" role="status" aria-live="polite"></p>

        <section class="panel resumen" aria-labelledby="titulo-resumen">
            <h2 id="titulo-resumen">Resumen</h2>
            <ul class="contadores">
                <li><span id="cont-total" class="numero">0</span> en total</li>
                <li><span id="cont-pendientes" class="numero">0</span> pendientes</li>
                <li><span id="cont-completadas" class="numero">0</span> completadas</li>
                <li><span id="cont-vencidas" class="numero vencidas">0</span> vencidas</li>
            </ul>
            <div class="progreso">
                <label for="progreso">Avance general: <strong id="texto-progreso">0%</strong></label>
                <progress id="progreso" max="100" value="0">0%</progress>
            </div>
            <p id="por-materia" class="por-materia"></p>
        </section>

        <section class="panel formulario" aria-labelledby="titulo-form">
            <h2 id="titulo-form">Agregar tarea</h2>
            <form id="form-tarea" novalidate>
                <p id="mensaje-form" class="mensaje" role="alert"></p>

                <label for="titulo">Título de la tarea</label>
                <input type="text" id="titulo" name="titulo" maxlength="80" autocomplete="off" aria-describedby="error-titulo">
                <span id="error-titulo" class="error"></span>

                <label for="materia">Materia</label>
                <select id="materia" name="materia" aria-describedby="error-materia"></select>
                <span id="error-materia" class="error"></span>

                <label for="fecha">Fecha de entrega</label>
                <input type="date" id="fecha" name="fecha" aria-describedby="error-fecha">
                <span id="error-fecha" class="error"></span>

                <label for="prioridad">Prioridad</label>
                <select id="prioridad" name="prioridad" aria-describedby="error-prioridad">
                    <option value="alta">Alta</option>
                    <option value="media" selected>Media</option>
                    <option value="baja">Baja</option>
                </select>
                <span id="error-prioridad" class="error"></span>

                <label for="notas">Notas (opcional)</label>
                <textarea id="notas" name="notas" rows="3" aria-describedby="error-notas"></textarea>
                <span id="error-notas" class="error"></span>

                <div class="botones">
                    <button type="submit" id="btn-guardar" class="btn primario">Agregar tarea</button>
                    <button type="button" id="btn-cancelar" class="btn secundario" hidden>Cancelar edición</button>
                </div>
            </form>
        </section>

        <section class="panel listado" aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Mis tareas</h2>

            <div class="controles">
                <div>
                    <label for="buscar">Buscar</label>
                    <input type="search" id="buscar" placeholder="Título o notas…" autocomplete="off">
                </div>
                <div>
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado">
                        <option value="todas">Todas</option>
                        <option value="pendientes">Pendientes</option>
                        <option value="completadas">Completadas</option>
                        <option value="vencidas">Vencidas</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-materia">Materia</label>
                    <select id="filtro-materia"></select>
                </div>
                <div>
                    <label for="orden">Ordenar por</label>
                    <select id="orden">
                        <option value="fecha">Fecha de entrega</option>
                        <option value="prioridad">Prioridad</option>
                        <option value="titulo">Título (A-Z)</option>
                        <option value="reciente">Más recientes</option>
                    </select>
                </div>
            </div>

            <p id="estado-lista" class="estado-lista"></p>
            <ul id="lista" class="lista"></ul>

            <button type="button" id="btn-limpiar" class="btn peligro-suave" hidden>Eliminar tareas completadas</button>
        </section>
    </main>

    <footer class="pie">
        <p>Actividad 3 · Laboratorio de Programación Web · FIME, UANL</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
